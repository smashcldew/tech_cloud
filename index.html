<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>科技脈絡圖</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
  body { font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #e8ecff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  #header { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: linear-gradient(#070a14 55%, rgba(7,10,20,0)); pointer-events: none; z-index: 5; }
  #header > * { pointer-events: auto; }
  #header h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .05em; }
  #header h1 small { font-weight: 400; opacity: .55; font-size: 12px; margin-left: 6px; }
  #search { flex: 1 1 140px; max-width: 220px; min-width: 120px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: inherit; padding: 6px 12px; border-radius: 999px; font-size: 14px; outline: none; }
  #search:focus { border-color: rgba(140,170,255,.7); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); color: inherit; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip[aria-pressed="true"] { background: rgba(140,170,255,.25); border-color: rgba(140,170,255,.8); }

  #legend { position: fixed; left: 0; right: 0; bottom: 8px; display: none; justify-content: center; flex-wrap: wrap; gap: 4px 14px; padding: 0 16px; font-size: 12px; opacity: .8; pointer-events: none; z-index: 4; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  #panel { position: fixed; left: 8px; right: 8px; bottom: 8px; background: rgba(16,20,38,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; z-index: 10; transition: opacity .2s, transform .2s; }
  #pbody { max-height: 40vh; overflow: auto; -webkit-overflow-scrolling: touch; padding: 14px 56px 16px 16px; }
  #panel.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
  #panel h2 { margin: 2px 0 6px; font-size: 20px; }
  #panel p { margin: 0 0 10px; font-size: 14px; line-height: 1.6; opacity: .9; }
  #panel h3 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; opacity: .55; letter-spacing: .1em; }
  #panel .pcat { font-size: 12px; opacity: .75; display: flex; align-items: center; gap: 6px; }
  #panel .pcat i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #close { position: absolute; top: 2px; right: 2px; width: 48px; height: 48px; z-index: 2; background: none; border: 0; color: inherit; font-size: 20px; opacity: .75; cursor: pointer; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .nchip { display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid; background: rgba(255,255,255,.04); color: inherit; cursor: pointer; font-family: inherit; }
  .none { font-size: 13px; opacity: .45; }

  @media (min-width: 760px) {
    #panel { left: auto; right: 16px; bottom: auto; top: 86px; width: 300px; }
    #pbody { max-height: calc(100vh - 150px); }
    #legend { display: flex; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="header">
  <h1>科技脈絡圖<small>點一個節點，看它建立在什麼之上</small><small class="ver">V1.0.0</small></h1>
  <input id="search" type="search" placeholder="搜尋技術…" autocomplete="off">
  <div class="chips" id="filters">
    <button class="chip" data-f="all" aria-pressed="true">全部</button>
    <button class="chip" data-f="hw" aria-pressed="false">硬體</button>
    <button class="chip" data-f="bridge" aria-pressed="false">介面層</button>
    <button class="chip" data-f="sw" aria-pressed="false">軟體</button>
  </div>
  <button class="chip" id="toggle" aria-pressed="true">分開</button>
</div>

<div id="legend"></div>

<div id="panel" class="hidden" role="dialog" aria-live="polite">
  <button id="close" type="button" aria-label="關閉">✕</button>
  <div id="pbody">
  <div class="pcat"><i id="pdot"></i><span id="pmeta"></span></div>
  <h2 id="pname"></h2>
  <p id="pdesc"></p>
  <h3>建立在</h3>
  <div id="pins"></div>
  <h3>催生了</h3>
  <div id="pouts"></div>
  </div>
</div>

<script>
"use strict";

/* ========== 資料（之後只要改這裡） ========== */
const DOMAINS = { hw: "硬體", bridge: "介面層", sw: "軟體" };

const CATS = {
  semi:    { name: "半導體",     color: "#5aa9ff" },
  compute: { name: "運算晶片",   color: "#3ad1e0" },
  storage: { name: "儲存",       color: "#6fe3a8" },
  comm:    { name: "通訊",       color: "#8f9bff" },
  device:  { name: "裝置",       color: "#b99cff" },
  bridge:  { name: "介面層",     color: "#ffc857" },
  lang:    { name: "語言與工具", color: "#ff7b8a" },
  os:      { name: "作業系統",   color: "#ff9d4d" },
  net:     { name: "網路協定",   color: "#ef78d8" },
  sec:     { name: "資訊安全",   color: "#ff5a5a" },
  data:    { name: "資料與雲端", color: "#d4e157" },
  ai:      { name: "人工智慧",   color: "#e0a3ff" }
};

// [id, 名稱, 領域, 類別, 年份, 說明]
const RAW_NODES = [
  ["transistor", "電晶體", "hw", "semi", 1947, "取代真空管的半導體開關，是所有現代電子運算的最小單位。"],
  ["ic", "積體電路", "hw", "semi", 1958, "把許多電晶體做在同一片晶片上，讓電子設備得以微型化。"],
  ["cmos", "CMOS 製程", "hw", "semi", 1963, "低功耗的晶片製造方式，至今仍是處理器與記憶體的基礎。"],
  ["cpu", "微處理器 CPU", "hw", "compute", 1971, "把運算核心整合進單一晶片（Intel 4004），開啟個人電腦時代。"],
  ["gpu", "GPU", "hw", "compute", 1999, "原本為繪圖設計的大量平行運算晶片，後來成為 AI 訓練的主力。"],
  ["accel", "AI 加速器", "hw", "compute", 2016, "專為矩陣運算設計的晶片（例如 TPU），讓大型模型訓練更有效率。"],
  ["dram", "DRAM 記憶體", "hw", "storage", 1970, "以電容儲存資料的主記憶體，速度快但斷電就消失。"],
  ["hdd", "硬碟", "hw", "storage", 1956, "以磁性碟片儲存資料，長年是主要的大容量儲存裝置。"],
  ["ssd", "快閃記憶體 SSD", "hw", "storage", 1980, "沒有機械結構的非揮發儲存，取代硬碟並成為手機儲存的基礎。"],
  ["ethernet", "乙太網路", "hw", "comm", 1973, "區域網路的有線標準，至今仍是辦公室與機房的主流。"],
  ["fiber", "光纖通訊", "hw", "comm", 1970, "用光脈衝傳輸資料，構成網際網路的骨幹。"],
  ["wifi", "Wi-Fi", "hw", "comm", 1997, "802.11 無線區域網路標準，讓裝置不用接線就能上網。"],
  ["smartphone", "智慧型手機", "hw", "device", 2007, "整合處理器、觸控螢幕、無線通訊與應用商店的行動運算裝置。"],

  ["isa", "指令集架構", "bridge", "bridge", 1964, "定義軟體如何指揮處理器的合約（IBM System/360），讓硬體與軟體能各自演進。"],
  ["bios", "韌體 BIOS", "bridge", "bridge", 1975, "開機時最先執行的程式，負責初始化硬體，再把控制權交給作業系統。"],
  ["driver", "驅動程式", "bridge", "bridge", 1980, "讓作業系統能操控特定硬體（顯示卡、網卡…）的軟體層。"],
  ["internet", "網際網路", "bridge", "bridge", 1983, "TCP/IP 全面啟用後，各種網路互連成全球網路，同時包含實體線路與協定。"],
  ["virtualization", "虛擬化", "bridge", "bridge", 1999, "用軟體模擬出多台虛擬電腦，需要處理器的硬體支援才有效率。"],

  ["assembly", "組合語言", "sw", "lang", 1949, "用助記符號取代機器碼，是最貼近硬體的程式語言。"],
  ["compiler", "編譯器", "sw", "lang", 1952, "把高階語言翻譯成機器碼的程式，讓人不必再手寫組合語言。"],
  ["c", "C 語言", "sw", "lang", 1972, "兼具高階語法與硬體控制能力，作業系統與嵌入式系統的主力語言。"],
  ["cpp", "C++", "sw", "lang", 1985, "在 C 之上加入物件導向，常用於遊戲、瀏覽器與高效能系統。"],
  ["java", "Java", "sw", "lang", 1995, "以虛擬機器達成「一次撰寫，到處執行」，長期主導企業應用。"],
  ["python", "Python", "sw", "lang", 1991, "語法簡潔易讀，是資料科學與機器學習最常用的語言。"],
  ["js", "JavaScript", "sw", "lang", 1995, "瀏覽器內建的語言，讓網頁具備互動能力。"],
  ["unix", "Unix", "sw", "os", 1969, "以 C 重寫的多工作業系統，奠定現代作業系統的設計思想。"],
  ["linux", "Linux", "sw", "os", 1991, "開源的類 Unix 核心，撐起伺服器、雲端與 Android。"],
  ["windows", "Windows", "sw", "os", 1985, "把圖形介面帶進一般桌上型電腦的作業系統。"],
  ["android", "Android", "sw", "os", 2008, "以 Linux 核心為基礎的行動作業系統，是全球最普及的手機系統。"],
  ["arpanet", "ARPANET", "sw", "net", 1969, "美國國防部資助的封包交換網路，是網際網路的前身。"],
  ["tcp", "TCP/IP", "sw", "net", 1974, "定義封包如何可靠傳送與定址的協定，是網際網路的共同語言。"],
  ["www", "全球資訊網", "sw", "net", 1989, "以超連結串起文件的系統（Tim Berners-Lee），讓網路普及到一般人。"],
  ["http", "HTTP", "sw", "net", 1991, "網頁瀏覽器與伺服器之間傳輸資料的應用層協定。"],
  ["browser", "瀏覽器", "sw", "net", 1993, "從 Mosaic 開始，把網頁以圖形方式呈現的軟體。"],
  ["pubkey", "公開金鑰密碼學", "sw", "sec", 1976, "加密與解密使用不同金鑰，讓陌生人也能安全通訊。"],
  ["tls", "TLS / SSL", "sw", "sec", 1995, "為網路連線加密與驗證身分，也就是網址前面的 HTTPS。"],
  ["database", "關聯式資料庫", "sw", "data", 1970, "以表格與 SQL 管理結構化資料，是大多數應用的資料核心。"],
  ["cloud", "雲端運算", "sw", "data", 2006, "把運算與儲存當成可租用的服務，以 AWS 為代表。"],
  ["container", "容器 Docker", "sw", "data", 2013, "把應用程式與其環境封裝在一起，讓部署在任何地方都一致。"],
  ["nn", "神經網路", "sw", "ai", 1958, "模仿神經元的運算模型（感知器），是深度學習的起點。"],
  ["backprop", "反向傳播", "sw", "ai", 1986, "有效率地訓練多層神經網路的演算法。"],
  ["dl", "深度學習", "sw", "ai", 2012, "利用 GPU 訓練深層網路，在影像辨識上取得突破。"],
  ["transformer", "Transformer", "sw", "ai", 2017, "以注意力機制處理序列的架構，成為現代語言模型的基礎。"],
  ["llm", "大型語言模型", "sw", "ai", 2018, "用海量文字訓練的 Transformer 模型，能生成與理解自然語言。"]
];

// [前置技術, 衍生技術]（A 是 B 的基礎）
const RAW_LINKS = [
  ["transistor", "ic"], ["ic", "cmos"], ["cmos", "cpu"], ["isa", "cpu"],
  ["ic", "dram"], ["dram", "unix"], ["ic", "ssd"], ["cmos", "gpu"], ["cpu", "gpu"], ["gpu", "accel"],
  ["isa", "assembly"], ["assembly", "compiler"], ["compiler", "c"],
  ["c", "unix"], ["cpu", "unix"], ["hdd", "unix"], ["unix", "linux"], ["c", "linux"],
  ["c", "cpp"], ["cpp", "java"], ["c", "python"],
  ["cpu", "bios"], ["bios", "windows"], ["bios", "linux"],
  ["gpu", "driver"], ["driver", "linux"], ["driver", "windows"],
  ["cpu", "virtualization"], ["virtualization", "cloud"], ["virtualization", "container"], ["linux", "container"],
  ["linux", "android"], ["java", "android"], ["smartphone", "android"],
  ["wifi", "smartphone"], ["ssd", "smartphone"], ["cpu", "smartphone"],
  ["arpanet", "tcp"], ["tcp", "internet"], ["ethernet", "internet"], ["fiber", "internet"], ["ethernet", "wifi"],
  ["internet", "www"], ["www", "http"], ["http", "browser"], ["browser", "js"],
  ["pubkey", "tls"], ["tcp", "tls"], ["http", "tls"],
  ["hdd", "database"], ["database", "cloud"], ["internet", "cloud"], ["ssd", "cloud"],
  ["nn", "backprop"], ["backprop", "dl"], ["gpu", "dl"], ["python", "dl"], ["dl", "accel"],
  ["dl", "transformer"], ["transformer", "llm"], ["accel", "llm"], ["cloud", "llm"], ["internet", "llm"]
];

/* ========== 資料整理 ========== */
function hexToRgb(h) {
  return parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16);
}
Object.values(CATS).forEach(c => { c.rgb = hexToRgb(c.color); });

const byId = {};
const nodes = RAW_NODES.map(([id, name, domain, cat, year, desc]) => {
  const n = {
    id, name, domain, cat, year, desc,
    x: 0, y: 0, vx: 0, vy: 0,
    phase: Math.random() * Math.PI * 2,
    speed: 0.6 + Math.random() * 0.8,
    ins: [], outs: [], deg: 0,
    a: 1, ta: 1, match: true
  };
  byId[id] = n;
  return n;
});
const links = RAW_LINKS.map(([a, b], i) => {
  const s = byId[a], t = byId[b];
  if (!s || !t) throw new Error("連線指向不存在的節點：" + a + " → " + b);
  s.outs.push(t);
  t.ins.push(s);
  return { s, t, a: 0.3, i };
});
nodes.forEach(n => { n.deg = n.ins.length + n.outs.length; });

/* ========== 畫布與尺寸 ========== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const header = document.getElementById("header");
let W = 0, H = 0, DPR = 1, S = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(0.55, Math.min(1.3, Math.sqrt(W * H) / 900));
}

/* ========== 狀態 ========== */
const YMIN = 1945, YMAX = 2020;
let separated = true;
let sepAmt = 1;
let domainFilter = "all";
let query = "";
let hover = null, selected = null, drag = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function radius(n) { return (6 + n.deg * 1.5) * S; }

function target(n) {
  const top = Math.max(H * 0.2, header.offsetHeight + 40);
  const bottom = H * 0.86;
  const k = Math.min(1, Math.max(0, (n.year - YMIN) / (YMAX - YMIN)));
  const ty = top + (bottom - top) * k;
  let tx = W * 0.5;
  if (separated) tx = n.domain === "hw" ? W * 0.22 : n.domain === "sw" ? W * 0.78 : W * 0.5;
  return [tx, ty];
}

/* ========== 物理（自製力導向，不需外部套件） ========== */
function step(t, dtScale) {
  const R = 150 * S, L = 95 * S;
  const wallL = W * 0.4, wallR = W * 0.6;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy);
      if (d >= R) continue;
      if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 0.5; }
      const f = ((R - d) / R) * 0.9;
      const nx = dx / d, ny = dy / d;
      a.vx -= nx * f * dtScale; a.vy -= ny * f * dtScale;
      b.vx += nx * f * dtScale; b.vy += ny * f * dtScale;
    }
  }

  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - L) * 0.012;
    const nx = dx / d, ny = dy / d;
    l.s.vx += nx * f * dtScale; l.s.vy += ny * f * dtScale;
    l.t.vx -= nx * f * dtScale; l.t.vy -= ny * f * dtScale;
  }

  const drift = reduceMotion ? 0.007 : 0.035;
  const damp = Math.pow(0.88, dtScale);
  for (const n of nodes) {
    if (n === drag) continue;
    const [tx, ty] = target(n);
    n.vx += (tx - n.x) * 0.004 * dtScale;
    n.vy += (ty - n.y) * 0.006 * dtScale;

    if (separated) {
      if (n.domain === "hw" && n.x > wallL) n.vx -= (n.x - wallL) * 0.02 * dtScale;
      else if (n.domain === "sw" && n.x < wallR) n.vx += (wallR - n.x) * 0.02 * dtScale;
      else if (n.domain === "bridge") {
        if (n.x < wallL) n.vx += (wallL - n.x) * 0.02 * dtScale;
        if (n.x > wallR) n.vx -= (n.x - wallR) * 0.02 * dtScale;
      }
    }
    const m = 36;
    if (n.x < m) n.vx += (m - n.x) * 0.03 * dtScale;
    if (n.x > W - m) n.vx -= (n.x - (W - m)) * 0.03 * dtScale;
    if (n.y < header.offsetHeight + 20) n.vy += (header.offsetHeight + 20 - n.y) * 0.03 * dtScale;
    if (n.y > H - 40) n.vy -= (n.y - (H - 40)) * 0.03 * dtScale;

    // 雲朵般的緩慢漂移
    n.vx += Math.cos(t * 0.0005 * n.speed + n.phase) * drift * dtScale;
    n.vy += Math.sin(t * 0.00043 * n.speed + n.phase * 1.7) * drift * dtScale;

    n.vx *= damp; n.vy *= damp;
    n.x += n.vx * dtScale;
    n.y += n.vy * dtScale;
  }
}

/* ========== 篩選 / 高亮 ========== */
function currentFocus() { return hover || selected; }

function updateTargets() {
  const focus = currentFocus();
  const focusSet = focus ? new Set([focus, ...focus.ins, ...focus.outs]) : null;
  for (const n of nodes) {
    let a = 1;
    if (domainFilter !== "all" && n.domain !== domainFilter) a = Math.min(a, 0.12);
    if (query && !n.match) a = Math.min(a, 0.12);
    if (focusSet && !focusSet.has(n)) a = Math.min(a, 0.15);
    n.ta = a;
    n.a += (a - n.a) * 0.15;
  }
  for (const l of links) {
    const base = Math.min(l.s.ta, l.t.ta);
    const target = focus ? (l.s === focus || l.t === focus ? base : 0.04) : 0.3 * base;
    l.a += (target - l.a) * 0.15;
  }
}

/* ========== 繪製 ========== */
function drawBands() {
  if (sepAmt < 0.01) return;
  const top = header.offsetHeight;
  const bands = [
    [0, W * 0.4, "90,169,255", W * 0.2, DOMAINS.hw + " HARDWARE"],
    [W * 0.4, W * 0.6, "255,200,87", W * 0.5, DOMAINS.bridge],
    [W * 0.6, W, "255,123,138", W * 0.8, DOMAINS.sw + " SOFTWARE"]
  ];
  ctx.textAlign = "center";
  ctx.font = "600 " + Math.round(13 * Math.max(0.9, S)) + "px system-ui, sans-serif";
  for (const [x0, x1, rgb, cx, label] of bands) {
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, "rgba(" + rgb + "," + (0.08 * sepAmt) + ")");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    ctx.fillStyle = g;
    ctx.fillRect(x0, top, x1 - x0, H - top);
    ctx.fillStyle = "rgba(" + rgb + "," + (0.75 * sepAmt) + ")";
    ctx.fillText(label, cx, Math.max(top + 4, H * 0.2 - 34) + 12);
  }
}

function drawLinks(t) {
  const focus = currentFocus();
  for (const l of links) {
    if (l.a < 0.01) continue;
    const { s, t: e } = l;
    const g = ctx.createLinearGradient(s.x, s.y, e.x, e.y);
    g.addColorStop(0, "rgba(" + CATS[s.cat].rgb + "," + l.a + ")");
    g.addColorStop(1, "rgba(" + CATS[e.cat].rgb + "," + l.a + ")");
    const active = focus && (s === focus || e === focus);
    ctx.strokeStyle = g;
    ctx.lineWidth = active ? 2 : 1.1;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();

    if (active) {
      const dx = e.x - s.x, dy = e.y - s.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      // 箭頭
      const ax = e.x - nx * (radius(e) + 5), ay = e.y - ny * (radius(e) + 5);
      ctx.fillStyle = "rgba(255,255,255," + (0.85 * l.a) + ")";
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - nx * 9 - ny * 4.5, ay - ny * 9 + nx * 4.5);
      ctx.lineTo(ax - nx * 9 + ny * 4.5, ay - ny * 9 - nx * 4.5);
      ctx.closePath();
      ctx.fill();
      // 沿線流動的光點（由前置技術流向衍生技術）
      const p = ((t * 0.0003 + l.i * 0.13) % 1);
      ctx.fillStyle = "rgba(255,255,255," + (0.9 * l.a) + ")";
      ctx.beginPath();
      ctx.arc(s.x + dx * p, s.y + dy * p, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawNode(n, t) {
  const r = radius(n);
  const c = CATS[n.cat];
  const a = n.a;
  if (a < 0.01) return;

  // 外層光暈
  const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 2.8);
  g.addColorStop(0, "rgba(" + c.rgb + "," + 0.5 * a + ")");
  g.addColorStop(0.45, "rgba(" + c.rgb + "," + 0.16 * a + ")");
  g.addColorStop(1, "rgba(" + c.rgb + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 2.8, 0, Math.PI * 2);
  ctx.fill();

  // 雲朵：幾個會緩慢蠕動的圓疊在一起
  ctx.fillStyle = "rgba(" + c.rgb + "," + 0.5 * a + ")";
  for (let k = 0; k < 3; k++) {
    const ang = t * 0.0009 * n.speed + n.phase + k * 2.1;
    ctx.beginPath();
    ctx.arc(n.x + Math.cos(ang) * r * 0.42, n.y + Math.sin(ang * 1.3) * r * 0.34, r * 0.78, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(" + c.rgb + "," + 0.95 * a + ")";
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 0.72, 0, Math.PI * 2);
  ctx.fill();

  if (n === selected) {
    ctx.strokeStyle = "rgba(255,255,255," + 0.85 * a + ")";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 1.55, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawLabel(n) {
  if (n.a < 0.08) return;
  const r = radius(n);
  ctx.font = "500 " + Math.round(12 * Math.max(0.95, Math.min(1.1, S))) + "px system-ui, \"Noto Sans TC\", \"PingFang TC\", \"Microsoft JhengHei\", sans-serif";
  ctx.textAlign = "center";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(7,10,20," + 0.85 * n.a + ")";
  ctx.strokeText(n.name, n.x, n.y + r + 15);
  ctx.fillStyle = "rgba(235,240,255," + n.a + ")";
  ctx.fillText(n.name, n.x, n.y + r + 15);
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  drawBands();
  drawLinks(t);
  for (const n of nodes) drawNode(n, t);
  for (const n of nodes) drawLabel(n);
}

/* ========== 主迴圈 ========== */
let last = performance.now();
function frame(now) {
  const dtScale = Math.min(2, (now - last) / 16.67);
  last = now;
  sepAmt += ((separated ? 1 : 0) - sepAmt) * 0.08;
  step(now, dtScale);
  updateTargets();
  draw(now);
  requestAnimationFrame(frame);
}

/* ========== 互動 ========== */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function pick(x, y) {
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (n.ta < 0.1) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < radius(n) * 1.5 + 10 && d < bd) { best = n; bd = d; }
  }
  return best;
}

let downPos = null, moved = false;
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);
  downPos = p;
  moved = false;
  const n = pick(p.x, p.y);
  if (n) { drag = n; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener("pointermove", e => {
  const p = pos(e);
  if (drag) {
    if (!moved && Math.hypot(p.x - downPos.x, p.y - downPos.y) > 5) moved = true;
    if (moved) { drag.x = p.x; drag.y = p.y; drag.vx = 0; drag.vy = 0; }
  } else if (e.pointerType === "mouse") {
    hover = pick(p.x, p.y);
    canvas.style.cursor = hover ? "pointer" : "default";
  }
});
canvas.addEventListener("pointerup", () => {
  if (drag) {
    if (!moved) select(drag);
    drag = null;
  } else if (!moved) {
    select(null);
  }
});
canvas.addEventListener("pointerleave", () => { hover = null; });

/* ========== 側欄 ========== */
const panel = document.getElementById("panel");
function fillChips(el, list) {
  el.textContent = "";
  if (!list.length) {
    const s = document.createElement("span");
    s.className = "none";
    s.textContent = "（無）";
    el.appendChild(s);
    return;
  }
  for (const n of list) {
    const b = document.createElement("button");
    b.className = "nchip";
    b.textContent = n.name;
    b.style.borderColor = CATS[n.cat].color;
    b.addEventListener("click", () => select(n));
    el.appendChild(b);
  }
}
function select(n) {
  selected = n;
  if (!n) { panel.classList.add("hidden"); return; }
  const c = CATS[n.cat];
  document.getElementById("pdot").style.background = c.color;
  document.getElementById("pmeta").textContent = DOMAINS[n.domain] + " · " + c.name + " · " + n.year;
  document.getElementById("pname").textContent = n.name;
  document.getElementById("pdesc").textContent = n.desc;
  fillChips(document.getElementById("pins"), n.ins);
  fillChips(document.getElementById("pouts"), n.outs);
  panel.classList.remove("hidden");
  document.getElementById("pbody").scrollTop = 0;
}
const closeBtn = document.getElementById("close");
function closePanel(e) {
  e.preventDefault();
  e.stopPropagation();
  select(null);
}
closeBtn.addEventListener("click", closePanel);
closeBtn.addEventListener("touchend", closePanel);

/* ========== 控制列 ========== */
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  domainFilter = b.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
const toggleBtn = document.getElementById("toggle");
toggleBtn.addEventListener("click", () => {
  separated = !separated;
  toggleBtn.setAttribute("aria-pressed", String(separated));
  toggleBtn.textContent = separated ? "分開" : "合併";
});
const search = document.getElementById("search");
function applySearch() {
  query = search.value.trim().toLowerCase();
  for (const n of nodes) {
    n.match = !query || n.name.toLowerCase().includes(query) || n.id.toLowerCase().includes(query);
  }
}
search.addEventListener("input", applySearch);
search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const m = nodes.find(n => n.match && query);
    if (m) select(m);
  }
});

/* 圖例 */
const legend = document.getElementById("legend");
for (const key of Object.keys(CATS)) {
  const span = document.createElement("span");
  const i = document.createElement("i");
  i.style.background = CATS[key].color;
  span.appendChild(i);
  span.appendChild(document.createTextNode(CATS[key].name));
  legend.appendChild(span);
}

/* ========== 初始化 ========== */
resize();
window.addEventListener("resize", resize);
for (const n of nodes) {
  const [tx, ty] = target(n);
  n.x = tx + (Math.random() - 0.5) * W * 0.16;
  n.y = ty + (Math.random() - 0.5) * 50;
}
for (let i = 0; i < 250; i++) step(0, 1); // 預先跑一段讓版面先穩定
updateTargets();
nodes.forEach(n => { n.a = n.ta; });
requestAnimationFrame(frame);
</script>
</body>
