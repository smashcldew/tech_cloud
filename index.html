<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.1.0">
<title>科技脈絡圖</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
  body { font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #e8ecff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  #header { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: linear-gradient(#070a14 55%, rgba(7,10,20,0)); pointer-events: none; z-index: 5; }
  #header > * { pointer-events: auto; }
  #header h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .05em; }
  #header h1 small { font-weight: 400; opacity: .55; font-size: 12px; margin-left: 6px; }
  #search { flex: 1 1 140px; max-width: 220px; min-width: 120px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: inherit; padding: 6px 12px; border-radius: 999px; font-size: 14px; outline: none; }
  #search:focus { border-color: rgba(140,170,255,.7); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); color: inherit; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip[aria-pressed="true"] { background: rgba(140,170,255,.25); border-color: rgba(140,170,255,.8); }

  #legend { position: fixed; left: 0; right: 0; bottom: 8px; display: none; justify-content: center; flex-wrap: wrap; gap: 4px 14px; padding: 0 16px; font-size: 12px; opacity: .8; pointer-events: none; z-index: 4; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  #panel { position: fixed; left: 8px; right: 8px; bottom: 8px; background: rgba(16,20,38,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; z-index: 10; transition: opacity .2s, transform .2s; }
  #pbody { max-height: 40vh; overflow: auto; -webkit-overflow-scrolling: touch; padding: 14px 56px 16px 16px; }
  #panel.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
  #panel h2 { margin: 2px 0 6px; font-size: 20px; }
  #panel p { margin: 0 0 10px; font-size: 14px; line-height: 1.6; opacity: .9; }
  #panel h3 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; opacity: .55; letter-spacing: .1em; }
  #panel .pcat { font-size: 12px; opacity: .75; display: flex; align-items: center; gap: 6px; }
  #panel .pcat i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #close { position: absolute; top: 2px; right: 2px; width: 48px; height: 48px; z-index: 2; background: none; border: 0; color: inherit; font-size: 20px; opacity: .75; cursor: pointer; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .nchip { display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid; background: rgba(255,255,255,.04); color: inherit; cursor: pointer; font-family: inherit; }
  .none { font-size: 13px; opacity: .45; }

  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 20; background: #070a14; line-height: 1.7; }

  @media (min-width: 760px) {
    #panel { left: auto; right: 16px; bottom: auto; top: 86px; width: 300px; }
    #pbody { max-height: calc(100vh - 150px); }
    #legend { display: flex; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="header">
  <h1>科技脈絡圖<small>點節點看來源，上下滑動瀏覽年代</small><small id="ver"></small></h1>
  <input id="search" type="search" placeholder="搜尋技術…" autocomplete="off">
  <div class="chips" id="filters">
    <button class="chip" data-f="all" aria-pressed="true">全部</button>
    <button class="chip" data-f="hw" aria-pressed="false">硬體</button>
    <button class="chip" data-f="bridge" aria-pressed="false">介面層</button>
    <button class="chip" data-f="sw" aria-pressed="false">軟體</button>
  </div>
  <button class="chip" id="toggle" aria-pressed="true">分開</button>
</div>

<div id="legend"></div>

<div id="panel" class="hidden" role="dialog" aria-live="polite">
  <button id="close" type="button" aria-label="關閉">✕</button>
  <div id="pbody">
    <div class="pcat"><i id="pdot"></i><span id="pmeta"></span></div>
    <h2 id="pname"></h2>
    <p id="pdesc"></p>
    <h3>建立在</h3>
    <div id="pins"></div>
    <h3>催生了</h3>
    <div id="pouts"></div>
  </div>
</div>

<div id="err">找不到資料檔 data.js<br>請確認 index.html 與 data.js 放在同一個資料夾。</div>

<script src="data.js"></script>
<script>
"use strict";

if (!window.TECH_DATA) {
  document.getElementById("err").style.display = "flex";
  throw new Error("找不到 data.js");
}
const { DOMAINS, CATS, NODES: RAW_NODES, LINKS: RAW_LINKS, VERSION } = window.TECH_DATA;
document.getElementById("ver").textContent = "V" + VERSION;

/* ========== 資料整理 ========== */
function hexToRgb(h) {
  return parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16);
}
Object.values(CATS).forEach(c => { c.rgb = hexToRgb(c.color); });

const byId = {};
const domainCount = {};
const nodes = RAW_NODES.map(([id, name, domain, cat, year, desc]) => {
  const n = {
    id, name, domain, cat, year, desc,
    x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0,
    phase: Math.random() * Math.PI * 2,
    speed: 0.6 + Math.random() * 0.8,
    ins: [], outs: [], deg: 0,
    a: 1, ta: 1, match: true
  };
  byId[id] = n;
  domainCount[domain] = (domainCount[domain] || 0) + 1;
  return n;
});
const links = RAW_LINKS.map(([a, b], i) => {
  const s = byId[a], t = byId[b];
  if (!s || !t) throw new Error("連線指向不存在的節點：" + a + " → " + b);
  s.outs.push(t);
  t.ins.push(s);
  return { s, t, a: 0.3, i };
});
nodes.forEach(n => { n.deg = n.ins.length + n.outs.length; });

/* ========== 畫布、尺寸與版面 ========== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const header = document.getElementById("header");
let W = 0, H = 0, DPR = 1, S = 1, headerH = 80;
let WH = 0;            // 世界高度（比螢幕高，可上下捲動）
let camY = 0;          // 目前捲動位置
let camTarget = null;  // 平滑捲動的目標

const YMIN = 1945, YMAX = 2023;
const ZONES = { hwEnd: 0.36, brEnd: 0.5 };           // 硬體 0~0.36、介面層 0.36~0.5、軟體 0.5~1
const CENTERS = { hw: 0.18, bridge: 0.43, sw: 0.75 };
let separated = true;
let sepAmt = 1;
let domainFilter = "all";
let query = "";
let hover = null, selected = null, drag = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function radius(n) { return (5 + Math.sqrt(n.deg) * 3) * S; }

function yOf(year) {
  const k = Math.min(1, Math.max(0, (year - YMIN) / (YMAX - YMIN)));
  const kw = Math.pow(k, 1.5); // 越新的年代節點越多，所以把新年代拉得比較開
  const top = headerH + 50, bottom = WH - 60;
  return top + (bottom - top) * kw;
}

function layout() {
  // 依節點密度決定世界高度：每個節點約需要 AREA 的面積
  const AREA = 17000 * S * S;
  let need = 0;
  if (separated) {
    const zoneW = { hw: W * ZONES.hwEnd, bridge: W * (ZONES.brEnd - ZONES.hwEnd), sw: W * (1 - ZONES.brEnd) };
    for (const d of Object.keys(domainCount)) need = Math.max(need, (domainCount[d] * AREA) / zoneW[d]);
  } else {
    need = (nodes.length * AREA) / (W * 0.9);
  }
  WH = Math.min(H * 8, Math.max(H, need + headerH + 120));
  for (const n of nodes) {
    n.ty = yOf(n.year);
    n.tx = separated ? W * CENTERS[n.domain] : W * 0.5;
  }
  clampCam();
}

function clampCam() { camY = Math.max(0, Math.min(Math.max(0, WH - H), camY)); }

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(0.55, Math.min(1.3, Math.sqrt(W * H) / 900));
  headerH = header.offsetHeight;
  layout();
}

/* ========== 物理（自製力導向，不需外部套件） ========== */
function step(t, dtScale) {
  const R = 150 * S, L = 95 * S;
  const wallL = W * ZONES.hwEnd, wallR = W * ZONES.brEnd;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dy = b.y - a.y;
      if (dy > R || dy < -R) continue;
      let dx = b.x - a.x;
      if (dx > R || dx < -R) continue;
      let d = Math.hypot(dx, dy);
      if (d >= R) continue;
      if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 0.5; }
      const f = ((R - d) / R) * 0.9 * dtScale;
      const nx = dx / d, ny = dy / d;
      a.vx -= nx * f; a.vy -= ny * f;
      b.vx += nx * f; b.vy += ny * f;
    }
  }

  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - L) * 0.008 * dtScale;
    const nx = dx / d, ny = dy / d;
    l.s.vx += nx * f; l.s.vy += ny * f;
    l.t.vx -= nx * f; l.t.vy -= ny * f;
  }

  const drift = reduceMotion ? 0.007 : 0.035;
  const damp = Math.pow(0.88, dtScale);
  const topLimit = headerH + 20, botLimit = WH - 40;
  for (const n of nodes) {
    if (n === drag) continue;
    n.vx += (n.tx - n.x) * 0.01 * dtScale;
    n.vy += (n.ty - n.y) * 0.01 * dtScale;

    if (separated) {
      if (n.domain === "hw" && n.x > wallL) n.vx -= (n.x - wallL) * 0.06 * dtScale;
      else if (n.domain === "sw" && n.x < wallR) n.vx += (wallR - n.x) * 0.06 * dtScale;
      else if (n.domain === "bridge") {
        if (n.x < wallL) n.vx += (wallL - n.x) * 0.06 * dtScale;
        if (n.x > wallR) n.vx -= (n.x - wallR) * 0.06 * dtScale;
      }
    }
    const mL = 40, mR = 58; // 右邊多留一點，避免文字被切掉
    if (n.x < mL) n.vx += (mL - n.x) * 0.03 * dtScale;
    if (n.x > W - mR) n.vx -= (n.x - (W - mR)) * 0.03 * dtScale;
    if (n.y < topLimit) n.vy += (topLimit - n.y) * 0.03 * dtScale;
    if (n.y > botLimit) n.vy -= (n.y - botLimit) * 0.03 * dtScale;

    // 雲朵般的緩慢漂移
    n.vx += Math.cos(t * 0.0005 * n.speed + n.phase) * drift * dtScale;
    n.vy += Math.sin(t * 0.00043 * n.speed + n.phase * 1.7) * drift * dtScale;

    n.vx *= damp; n.vy *= damp;
    n.x += n.vx * dtScale;
    n.y += n.vy * dtScale;
  }
}

/* ========== 篩選 / 高亮 ========== */
function currentFocus() { return hover || selected; }

function updateTargets() {
  const focus = currentFocus();
  const focusSet = focus ? new Set([focus, ...focus.ins, ...focus.outs]) : null;
  for (const n of nodes) {
    let a = 1;
    if (domainFilter !== "all" && n.domain !== domainFilter) a = Math.min(a, 0.12);
    if (query && !n.match) a = Math.min(a, 0.12);
    if (focusSet && !focusSet.has(n)) a = Math.min(a, 0.15);
    n.ta = a;
    n.a += (a - n.a) * 0.15;
  }
  for (const l of links) {
    const base = Math.min(l.s.ta, l.t.ta);
    const target = focus ? (l.s === focus || l.t === focus ? base : 0.04) : 0.3 * base;
    l.a += (target - l.a) * 0.15;
  }
}

/* ========== 繪製 ========== */
function drawBands() {
  if (sepAmt < 0.01) return;
  const top = headerH;
  const bands = [
    [0, W * ZONES.hwEnd, "90,169,255", W * CENTERS.hw, DOMAINS.hw + " HARDWARE"],
    [W * ZONES.hwEnd, W * ZONES.brEnd, "255,200,87", W * CENTERS.bridge, DOMAINS.bridge],
    [W * ZONES.brEnd, W, "255,123,138", W * CENTERS.sw, DOMAINS.sw + " SOFTWARE"]
  ];
  ctx.textAlign = "center";
  ctx.font = "600 " + Math.round(13 * Math.max(0.9, S)) + "px system-ui, sans-serif";
  for (const [x0, x1, rgb, cx, label] of bands) {
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, "rgba(" + rgb + "," + (0.08 * sepAmt) + ")");
    g.addColorStop(1, "rgba(" + rgb + "," + (0.03 * sepAmt) + ")");
    ctx.fillStyle = g;
    ctx.fillRect(x0, top, x1 - x0, H - top);
    ctx.fillStyle = "rgba(" + rgb + "," + (0.8 * sepAmt) + ")";
    ctx.fillText(label, cx, top + 6);
  }
}

function drawDecades() {
  ctx.font = "11px system-ui, sans-serif";
  ctx.textAlign = "left";
  for (let year = 1950; year <= 2020; year += 10) {
    const y = yOf(year);
    if (y < camY - 20 || y > camY + H + 20) continue;
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    ctx.fillText(String(year), 6, y - 4);
  }
}

function drawLinks(t) {
  const focus = currentFocus();
  const lo = camY - 60, hi = camY + H + 60;
  for (const l of links) {
    if (l.a < 0.01) continue;
    const { s, t: e } = l;
    if ((s.y < lo && e.y < lo) || (s.y > hi && e.y > hi)) continue;
    const g = ctx.createLinearGradient(s.x, s.y, e.x, e.y);
    g.addColorStop(0, "rgba(" + CATS[s.cat].rgb + "," + l.a + ")");
    g.addColorStop(1, "rgba(" + CATS[e.cat].rgb + "," + l.a + ")");
    const active = focus && (s === focus || e === focus);
    ctx.strokeStyle = g;
    ctx.lineWidth = active ? 2 : 1.1;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();

    if (active) {
      const dx = e.x - s.x, dy = e.y - s.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      // 箭頭
      const ax = e.x - nx * (radius(e) + 5), ay = e.y - ny * (radius(e) + 5);
      ctx.fillStyle = "rgba(255,255,255," + (0.85 * l.a) + ")";
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - nx * 9 - ny * 4.5, ay - ny * 9 + nx * 4.5);
      ctx.lineTo(ax - nx * 9 + ny * 4.5, ay - ny * 9 - nx * 4.5);
      ctx.closePath();
      ctx.fill();
      // 沿線流動的光點（由前置技術流向衍生技術）
      const p = ((t * 0.0003 + l.i * 0.13) % 1);
      ctx.fillStyle = "rgba(255,255,255," + (0.9 * l.a) + ")";
      ctx.beginPath();
      ctx.arc(s.x + dx * p, s.y + dy * p, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawNode(n, t) {
  const r = radius(n);
  const c = CATS[n.cat];
  const a = n.a;
  if (a < 0.01) return;

  // 外層光暈
  const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 2.8);
  g.addColorStop(0, "rgba(" + c.rgb + "," + 0.5 * a + ")");
  g.addColorStop(0.45, "rgba(" + c.rgb + "," + 0.16 * a + ")");
  g.addColorStop(1, "rgba(" + c.rgb + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 2.8, 0, Math.PI * 2);
  ctx.fill();

  // 雲朵：幾個會緩慢蠕動的圓疊在一起
  ctx.fillStyle = "rgba(" + c.rgb + "," + 0.5 * a + ")";
  for (let k = 0; k < 3; k++) {
    const ang = t * 0.0009 * n.speed + n.phase + k * 2.1;
    ctx.beginPath();
    ctx.arc(n.x + Math.cos(ang) * r * 0.42, n.y + Math.sin(ang * 1.3) * r * 0.34, r * 0.78, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(" + c.rgb + "," + 0.95 * a + ")";
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 0.72, 0, Math.PI * 2);
  ctx.fill();

  if (n === selected) {
    ctx.strokeStyle = "rgba(255,255,255," + 0.85 * a + ")";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 1.55, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawLabel(n) {
  if (n.a < 0.08) return;
  const r = radius(n);
  ctx.textAlign = "center";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(7,10,20," + 0.85 * n.a + ")";
  ctx.strokeText(n.name, n.x, n.y + r + 15);
  ctx.fillStyle = "rgba(235,240,255," + n.a + ")";
  ctx.fillText(n.name, n.x, n.y + r + 15);
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  drawBands();

  ctx.save();
  ctx.translate(0, -camY);
  drawDecades();
  drawLinks(t);
  const lo = camY - 90, hi = camY + H + 90;
  const visible = nodes.filter(n => n.y > lo && n.y < hi);
  for (const n of visible) drawNode(n, t);
  ctx.font = "500 12px system-ui, \"Noto Sans TC\", \"PingFang TC\", \"Microsoft JhengHei\", sans-serif";
  for (const n of visible) drawLabel(n);
  ctx.restore();

  // 右側捲動指示
  if (WH > H + 1) {
    const barH = Math.max(30, (H * H) / WH);
    const barY = (camY / (WH - H)) * (H - barH);
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(W - 3, barY, 2, barH);
  }
}

/* ========== 主迴圈 ========== */
let last = performance.now();
function frame(now) {
  const dtScale = Math.min(2, (now - last) / 16.67);
  last = now;
  sepAmt += ((separated ? 1 : 0) - sepAmt) * 0.08;
  if (camTarget !== null) {
    camY += (camTarget - camY) * 0.12;
    if (Math.abs(camTarget - camY) < 0.5) camTarget = null;
    clampCam();
  }
  step(now, dtScale);
  updateTargets();
  draw(now);
  requestAnimationFrame(frame);
}

/* ========== 互動 ========== */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  return { x: sx, sy, y: sy + camY };
}
function pick(x, y) {
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (n.ta < 0.1) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < radius(n) * 1.5 + 10 && d < bd) { best = n; bd = d; }
  }
  return best;
}

let downPos = null, moved = false, panning = false, panStartCam = 0;
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);
  downPos = p;
  moved = false;
  const n = pick(p.x, p.y);
  if (n) drag = n; else { panning = true; panStartCam = camY; }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  const p = pos(e);
  if (drag || panning) {
    if (!moved && Math.hypot(p.x - downPos.x, p.sy - downPos.sy) > 5) moved = true;
    if (!moved) return;
    if (drag) {
      drag.x = p.x; drag.y = p.y; drag.vx = 0; drag.vy = 0;
    } else {
      camY = panStartCam - (p.sy - downPos.sy);
      clampCam();
      camTarget = null;
    }
  } else if (e.pointerType === "mouse") {
    hover = pick(p.x, p.y);
    canvas.style.cursor = hover ? "pointer" : "default";
  }
});
canvas.addEventListener("pointerup", () => {
  if (drag) {
    if (!moved) select(drag, false);
    drag = null;
  } else if (panning) {
    panning = false;
    if (!moved) select(null, false);
  }
});
canvas.addEventListener("pointercancel", () => { drag = null; panning = false; });
canvas.addEventListener("pointerleave", () => { hover = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  camY += e.deltaY;
  clampCam();
  camTarget = null;
}, { passive: false });

/* ========== 側欄 ========== */
const panel = document.getElementById("panel");
function fillChips(el, list) {
  el.textContent = "";
  if (!list.length) {
    const s = document.createElement("span");
    s.className = "none";
    s.textContent = "（無）";
    el.appendChild(s);
    return;
  }
  for (const n of list) {
    const b = document.createElement("button");
    b.className = "nchip";
    b.type = "button";
    b.textContent = n.name;
    b.style.borderColor = CATS[n.cat].color;
    b.addEventListener("click", () => select(n, true));
    el.appendChild(b);
  }
}
function select(n, center) {
  selected = n;
  if (!n) { panel.classList.add("hidden"); return; }
  const c = CATS[n.cat];
  document.getElementById("pdot").style.background = c.color;
  document.getElementById("pmeta").textContent = DOMAINS[n.domain] + " · " + c.name + " · " + n.year;
  document.getElementById("pname").textContent = n.name;
  document.getElementById("pdesc").textContent = n.desc;
  fillChips(document.getElementById("pins"), n.ins);
  fillChips(document.getElementById("pouts"), n.outs);
  panel.classList.remove("hidden");
  document.getElementById("pbody").scrollTop = 0;
  if (center) camTarget = Math.max(0, Math.min(Math.max(0, WH - H), n.y - H * 0.32));
}
const closeBtn = document.getElementById("close");
function closePanel(e) {
  e.preventDefault();
  e.stopPropagation();
  select(null, false);
}
closeBtn.addEventListener("click", closePanel);
closeBtn.addEventListener("touchend", closePanel);

/* ========== 控制列 ========== */
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  domainFilter = b.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
const toggleBtn = document.getElementById("toggle");
toggleBtn.addEventListener("click", () => {
  separated = !separated;
  toggleBtn.setAttribute("aria-pressed", String(separated));
  toggleBtn.textContent = separated ? "分開" : "合併";
  layout();
});
const search = document.getElementById("search");
function applySearch() {
  query = search.value.trim().toLowerCase();
  for (const n of nodes) {
    n.match = !query || n.name.toLowerCase().includes(query) || n.id.toLowerCase().includes(query);
  }
}
search.addEventListener("input", applySearch);
search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const m = nodes.find(n => n.match && query);
    if (m) select(m, true);
  }
});

/* 圖例 */
const legend = document.getElementById("legend");
for (const key of Object.keys(CATS)) {
  const span = document.createElement("span");
  const i = document.createElement("i");
  i.style.background = CATS[key].color;
  span.appendChild(i);
  span.appendChild(document.createTextNode(CATS[key].name));
  legend.appendChild(span);
}

/* ========== 初始化 ========== */
resize();
window.addEventListener("resize", resize);
window.addEventListener("load", resize);
for (const n of nodes) {
  n.x = n.tx + (Math.random() - 0.5) * W * 0.16;
  n.y = n.ty + (Math.random() - 0.5) * 50;
}
for (let i = 0; i < 350; i++) step(0, 1); // 預先跑一段讓版面先穩定
updateTargets();
nodes.forEach(n => { n.a = n.ta; });
requestAnimationFrame(frame);
</script>
</body>
</html>
